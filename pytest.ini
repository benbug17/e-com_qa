[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml
markers =
    smoke: critical-path checks, run on every build
    regression: full functional regression
    negative: invalid input / error handling
    ui: Selenium browser tests
    api: REST API tests
    db: database validation tests
    e2e: cross-layer (UI/API/DB) tests
    bdd: Gherkin scenarios
